name: hatri
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_bloc: ^8.1.5
  go_router: ^13.2.0
  equatable: ^2.0.5
  get_it: ^7.6.7
  intl: any
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  audioplayers: ^5.2.1
  share_plus: ^7.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  liquid_glass_renderer: ^0.2.0-dev.4
  motor: ^1.1.0
  permission_handler: ^11.3.1
  video_player: ^2.9.2
  image_picker: ^1.2.3
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  connectivity_plus: ^6.1.0

  # ─── Backend API + Auth (hatri-backend integration) ───
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  uuid: ^4.5.1

  # ─── Firebase (push, crashes, perf) ───
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+11

  # ─── Analytics + Attribution ───
  mixpanel_flutter: ^2.3.5
  appsflyer_sdk: ^6.15.2

  # ─── Image handling (uploads + CDN reads) ───
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # ─── Location + Deep links ───
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  app_links: ^7.2.1

  # ─── UX polish ───
  flutter_local_notifications: ^17.2.3
  add_2_calendar: ^3.0.1
  shimmer: ^3.0.0

  # ─── Utilities ───
  package_info_plus: ^8.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_flavorizr: ^2.2.3

  # ─── Dev-only ───
  pretty_dio_logger: ^1.4.0

# NOTE: the themed (monochrome) Android layer is maintained by hand —
# flutter_launcher_icons 0.13.1 has no `adaptive_icon_monochrome` key and
# regenerating will drop the <monochrome> line from
# android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml. Re-add it after any run.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#CEFF05"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#CEFF05"
    theme_color: "#CEFF05"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - assets/images/
    - assets/images/utility/
    - assets/images/stickers/
    - assets/video/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.ttf
        - asset: assets/fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.ttf
          weight: 700
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.ttf
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
    - family: CabinetGrotesk
      fonts:
        - asset: assets/fonts/CabinetGrotesk-Regular.ttf
        - asset: assets/fonts/CabinetGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/CabinetGrotesk-Bold.ttf
          weight: 700
    - family: Bonny
      fonts:
        - asset: assets/fonts/Bonny-Regular.ttf
        - asset: assets/fonts/Bonny-Medium.ttf
          weight: 500
        - asset: assets/fonts/Bonny-Bold.ttf
          weight: 700
